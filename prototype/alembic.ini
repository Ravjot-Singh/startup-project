# Alembic migrations. The database URL comes from DATABASE_URL (see app/db.py: alembic_config).
#   Create a migration after changing app/models.py:
#     alembic revision --autogenerate -m "what changed"
#   Apply (also happens automatically when the app starts):
#     alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
