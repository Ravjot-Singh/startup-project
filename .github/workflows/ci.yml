name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: reminders_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: prototype # the app lives in prototype/
    env:
      # Postgres job: run the whole suite against the real database (the server starts in both jobs; sqlite ignores it)
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://test:test@localhost:5432/reminders_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: prototype/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # headless Chromium for the accessibility test (tests/test_a11y.py); only needed once
      - if: matrix.db == 'sqlite'
        run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
